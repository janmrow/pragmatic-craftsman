name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill frontmatter, manifest hashes, and trigger benchmark
        run: python3 evals/run.py validate
      - name: Run evaluation harness and fixture self-tests
        run: python3 evals/run.py selftest
